apiVersion: v1
kind: Service
metadata:
  name: "{{ include "brokerage-service-ui.fullname" . }}-service"
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}
    component: {{ .Values.componentName }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

